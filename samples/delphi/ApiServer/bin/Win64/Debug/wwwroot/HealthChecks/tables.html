    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>

      var service = 'http://127.0.0.1:8080/healthchecks';

      function prettyDate(time){
        var date = new Date((time || "").replace(/-/g,"/").replace(/[TZ]/g," ")),
            diff = (((new Date()).getTime() - date.getTime()) / 1000),
            day_diff = Math.floor(diff / 86400);

        return day_diff == 0 && (
                diff < 10 && "just now" ||
                diff < 60 && Math.floor(diff) + " seconds ago" ||
                diff < 120 && "1 min ago" ||
                diff < 3600 && Math.floor( diff / 60 ) + " min ago" ||
                diff < 7200 && "1 hour ago" ||
                diff < 86400 && Math.floor( diff / 3600 ) + " hours ago") ||
            day_diff == 1 && "Yesterday" ||
            day_diff < 7 && day_diff + " days ago" ||
            day_diff < 31 && Math.ceil( day_diff / 7 ) + " week(s)";
      }

      function hStatus(sStatus){
        return sStatus == 
          sStatus == 'hsNotChecked' && '<i class="fa fa-clock-o" style="color:gray;font-size:20px"</i>' ||
          sStatus == 'hsPassed' && '<i class="fa fa-check-circle" style="color:green;font-size:20px"</i> <a style="color:black;font-family:Helvetica Neue, Roboto, Arial, Droid Sans, sans-serif;font-size:13px">Healthy</a>' ||
          sStatus == 'hsFailed' && '<i class="fa fa-exclamation" style="color:red;font-size:20px"</i> <a style="color:black;font-family:Helvetica Neue, Roboto, Arial, Droid Sans, sans-serif;font-size:13px">Unhealthy</a>';
      }

      
      $(document).ready(function(){
      
          jQuery.support.cors = true;
          setInterval(function()
          {
            $.ajax(
            {
              type: "GET",
              url: service,
              //data: "{}",
              contentType: "application/json; charset=utf-8",
              dataType: "json",
              cache: true,
              success: function (data) {
      
              var trHTML = '';
              $("#tablechecks tbody").empty();
              $.each(data,function(i,item){
                $("#tablechecks tbody").append(
                    "<tr>"
                      +"<td>"+item.Name+"</td>"
                      +"<td>"+ hStatus(item.Status) + "</td>"
                      +"<td>"+prettyDate(item.LastStatusChange)+"</td>"
                      +"<td>"+item.TimeElapsed+"</td>"
                      +"<td>"+item.LastCheck+"</td>"
                      +"<td>"+item.ErrorMsg+"</td>"
                    +"</tr>" )
                })
              },
              error: function (msg) {
      
                  //alert(msg.responseText);
              }
            });
        }, 2000); //10000 milliseconds = 10 seconds
      })
      
      </script>
